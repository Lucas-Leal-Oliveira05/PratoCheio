<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio — Registrar doação</title>
  <link rel="stylesheet" href="./estilos.css">
</head>
<body>
  <a class="voltar" href="index.html">← voltar</a>
  <h1>Registrar doação</h1>
  <p class="subtitulo">Publique os alimentos que sobraram para que uma ONG possa reservá-los.</p>
 
  <fieldset>
    <legend>Seu estabelecimento</legend>
    <label for="doador">Nome do estabelecimento</label>
    <input id="doador" placeholder="Ex.: Padaria Pão Bom" autocomplete="organization">
  </fieldset>

  <fieldset>
    <legend>Nova doação</legend>
    <label for="tipo">Tipo de alimento</label>
    <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" placeholder="Ex.: 10 porções">
    <label for="validade">Validade / retirar até</label>
    <input id="validade" type="date">
    <button id="publicar">Publicar doação</button>
  </fieldset>
 
  <div id="aviso"></div>
 
  <h2>Minhas doações</h2>
  <ul id="lista"></ul>

  <script>
    function mostrarAviso(mensagem, tipo) {
      const aviso = document.getElementById('aviso');
      aviso.textContent = mensagem;
      aviso.className = mensagem ? `aviso ${tipo}` : '';
    }

    function dataHora(valor) {
      return new Date(valor).toLocaleString('pt-BR', {
        timeZone: 'America/Sao_Paulo', dateStyle: 'short', timeStyle: 'short'
      });
    }

    function situacao(d) {
      if (d.status === 'disponivel') return 'Disponível, aguardando uma ONG';
      if (d.status === 'aceita') return `Aceita por ${d.ong} em ${dataHora(d.aceita_em)}`;
      if (d.status === 'coletada') return `Coletada para ${d.ong} em ${dataHora(d.coletada_em)}`;
      if (d.status === 'cancelada') return 'Cancelada';
      return d.status;
    }

    const campoDoador = document.getElementById('doador');
    try { campoDoador.value = localStorage.getItem('pratocheio.doador') || ''; } catch {}
    campoDoador.addEventListener('change', () => {
      try { localStorage.setItem('pratocheio.doador', campoDoador.value.trim()); } catch {}
      carregar();
    });

    async function carregar() {
      const lista = document.getElementById('lista');
      const doador = campoDoador.value.trim();
      if (!doador) {
        lista.innerHTML = '<li>Informe o nome do estabelecimento para ver as suas doações.</li>';
        return;
      }

      const res = await fetch(`/api/doadores/${encodeURIComponent(doador)}/doacoes`);
      const doacoes = await res.json();
      if (!res.ok) {
        mostrarAviso(doacoes.erro, 'erro');
        return;
      }

      lista.innerHTML = doacoes.length ? '' : '<li>Nenhuma doação publicada por este estabelecimento.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        const titulo = document.createElement('strong');
        titulo.textContent = `${d.tipo} — ${d.quantidade}`;
        const detalhe = document.createElement('span');
        detalhe.className = 'situacao';
        detalhe.textContent = `${situacao(d)} · validade ${d.validade}`;
        li.append(titulo, detalhe);

        if (d.status === 'disponivel') {
          const cancelar = document.createElement('button');
          cancelar.textContent = 'Cancelar doação';
          cancelar.onclick = async () => {
            if (!confirm(`Cancelar a doação de "${d.tipo}"?`)) return;
            const res = await fetch(`/api/doacoes/${d.id}/cancelar`, { method: 'POST' });
            const corpo = await res.json();
            if (!res.ok) {
              mostrarAviso(corpo.erro, 'erro');
            } else {
              mostrarAviso(`Doação de "${corpo.tipo}" cancelada.`, 'sucesso');
            }
            carregar();
          };
          li.appendChild(cancelar);
        }
        lista.appendChild(li);
      }
    }

    document.getElementById('publicar').onclick = async () => {
      const doador = campoDoador.value;
      const tipo = document.getElementById('tipo').value;
      const quantidade = document.getElementById('quantidade').value;
      const validade = document.getElementById('validade').value;

      const res = await fetch('/api/doacoes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ doador, tipo, quantidade, validade })
      });
      const corpo = await res.json();
 
      if (!res.ok) {
        mostrarAviso(corpo.erro, 'erro');
      } else {
        mostrarAviso(`Doação de "${corpo.tipo}" publicada com sucesso.`, 'sucesso');
        document.getElementById('tipo').value = '';
        document.getElementById('quantidade').value = '';
        document.getElementById('validade').value = '';
      }
      carregar();
    };
 
    carregar();
  </script>
</body>
</html>
